# Default values for fhirsmith.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Workload kind: "Deployment" (default) or "StatefulSet".
#
# The Deployment mounts ONE shared PVC for the data dir, which a second replica
# scheduled onto another node cannot attach (ReadWriteOnce => Multi-Attach
# error). Running more than one replica with persistence therefore requires a
# StatefulSet, whose volumeClaimTemplates give each replica its own volume.
# FHIRsmith's terminology cache is immutable and read-only at runtime (the
# library is loaded once at startup), so per-replica copies behave identically
# to a shared one — and each replica keeps a warm cache across reschedules
# instead of re-downloading multi-GB code systems.
#
# The chart fails to render on `kind: Deployment` + persistence with a replica
# ceiling above 1 — `replicaCount`, or `autoscaling.maxReplicas` when the HPA is
# enabled — rather than producing pods that cannot schedule.
workload:
  kind: Deployment

  # StatefulSet only. OrderedReady brings replicas up one at a time, so a cold
  # start does not have every replica downloading terminology simultaneously.
  podManagementPolicy: OrderedReady

  # StatefulSet only (the Deployment uses `strategy` below).
  updateStrategy:
    type: RollingUpdate

  # StatefulSet only. Retain: the terminology cache is expensive to rebuild, so
  # scaling down or deleting the StatefulSet should not discard it.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

image:
  # Upstream image. Override it to pull through a mirror or a private registry.
  repository: ghcr.io/healthintersections/fhirsmith
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  # FHIRsmith runs as root (no runAsUser); liveness and readiness share the
  # single /health endpoint.
  kube-score/ignore: container-security-context-user-group-id,pod-probes-identical

podLabels: {}

podSecurityContext: {}

securityContext:
  # FHIRsmith only writes under $FHIRSMITH_DATA_DIR (dataDir), which is a mounted
  # volume and stays writable, so the container root filesystem can be read-only.
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

# FHIRsmith reads config.json and the terminology library from this directory
# ($FHIRSMITH_DATA_DIR). config.json / library.yml are mounted into it read-only
# from the ConfigMap; the rest is writable (terminology cache, logs).
dataDir: /app/data

# Storage for the data dir (terminology cache + logs).
# - Default (disabled): an emptyDir — fine for a minimal, npm-only library.
# - Enable a PVC when loading heavy code systems (SNOMED/LOINC), so the multi-GB
#   downloads survive pod restarts instead of being re-fetched every time.
# Under `workload.kind: StatefulSet` these settings feed the volumeClaimTemplate
# (one volume per replica) instead of a single shared PVC.
persistence:
  enabled: false
  # Empty: the cluster's default StorageClass.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

ingress: {}
# Example:
# enabled: true
# className: nginx
# hosts:
#   - host: fhirsmith.example.com
#     paths:
#       - path: /
#         pathType: Prefix
# tls: []

resources: {}
  # Recommended starting point (terminology expansion is memory-sensitive):
  # requests:
  #   cpu: 250m
  #   memory: 1Gi
  # limits:
  #   cpu: "1"
  #   memory: 2Gi

# FHIRsmith exposes a single, cheap GET /health endpoint (HTTP 200 JSON),
# used for all three probes.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  # Generous: first boot may download FHIR npm packages.
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  behavior: {}

# KEDA ScaledObject (requires the KEDA operator in the cluster). When enabled the workload's
# `replicas` field is not rendered, so KEDA is its only owner (an ArgoCD sync can no longer reset
# it). Mutually exclusive with `autoscaling.enabled`.
keda:
  enabled: false
  # ScaledObject name. Default: "<workload name>-cron".
  name: ""
  annotations: {}
  minReplicaCount: 0
  # Default: cron.desiredReplicas.
  maxReplicaCount: null
  # KEDA's own defaults are 30 and 300.
  pollingInterval: 60
  cooldownPeriod: 0
  # Replicas to run while the scaler is failing.
  fallback:
    enabled: true
    failureThreshold: 3
    # Default: cron.desiredReplicas.
    replicas: null
  # Rendered as a single `type: cron` trigger when start and end are both set.
  cron:
    timezone: Europe/Lisbon
    start: ""  # e.g. "00 08 * * 1-5"
    end: ""    # e.g. "00 23 * * 1-5"
    # Replicas inside the window. Default: replicaCount, or minReplicaCount if that is higher.
    desiredReplicas: null
  # Extra KEDA triggers, appended as-is (https://keda.sh/docs/latest/scalers/).
  triggers: []
  # Passed through as spec.advanced (e.g. horizontalPodAutoscalerConfig.behavior).
  advanced: {}
strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

# Pod Disruption Budget
pdb:
  enabled: false
  minAvailable: 33%
  # maxUnavailable: 1

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

networkPolicy:
  # Default allows all traffic. Environments should restrict this, e.g.:
  # Ingress: from the VPC CIDR + the namespace that calls this txServer.
  # Egress: DNS + 443 (FHIR npm package / terminology source fetches).
  ingress:
    - {}
  egress:
    - {}

# Direct environment variables (NODE_ENV, etc.)
env: []
#  - name: NODE_ENV
#    value: "production"

# Additional secrets exposed as environment variables (envFrom).
secretNames: []
#  - fhirsmith-secret

# ---------------------------------------------------------------------------
# FHIRsmith application configuration.
# Rendered verbatim into the ConfigMap as config.json (`config`) and
# library.yml (`library`), mounted into $FHIRSMITH_DATA_DIR.
# ---------------------------------------------------------------------------

# config.json — only the terminology (tx) module is enabled by default, so the
# service needs no secrets (no publisher session secret, no token OAuth).
config:
  hostName: fhirsmith
  server:
    port: 3000
    cors:
      origin: true
      credentials: true
  logging:
    level: info
    console: true
  modules:
    tx:
      enabled: true
      # librarySource is set automatically to "<dataDir>/library.yml" by the
      # ConfigMap template, so it always matches the mounted file.
      cacheTimeout: 30
      expansionCacheSize: 1000
      endpoints:
        - path: /tx/r4
          fhirVersion: "4.0"
          context: null
        - path: /tx/r5
          fhirVersion: "5.0"
          context: null
    shl:
      enabled: false
    vcl:
      enabled: false
    xig:
      enabled: false
    packages:
      enabled: false
    registry:
      enabled: false
    publisher:
      enabled: false
    npmprojector:
      enabled: false
    token:
      enabled: false
    folder:
      enabled: false
    ext-tracker:
      enabled: false

# library.yml — terminology sources. internal/ucum providers need no network;
# npm packages are fetched from the FHIR package registry at startup. This is a
# minimal R4 set. Heavy code systems (loinc/snomed/rxnorm/…) require pre-built DB
# files + persistence (see above) and are added per-environment.
# Supported internal providers: lang, country, currency, areacode, mimetypes,
# usstates, hgvs.
library:
  base:
    url: https://storage.googleapis.com/tx-fhir-org
  sources:
    - internal:lang
    - internal:country
    - internal:currency
    - internal:mimetypes
    - ucum:tx/data/ucum-essence.xml
    - npm:hl7.terminology
    - npm:fhir.tx.support.r4
