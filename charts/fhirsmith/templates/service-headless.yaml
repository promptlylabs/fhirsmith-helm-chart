{{- if eq (include "fhirsmith.workloadKind" .) "StatefulSet" }}
{{- /* Required by the StatefulSet's serviceName. Traffic uses the regular
       ClusterIP Service; this one only provides stable per-pod DNS. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fhirsmith.fullname" . }}-headless
  labels:
    {{- include "fhirsmith.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fhirsmith.selectorLabels" . | nindent 4 }}
{{- end }}
