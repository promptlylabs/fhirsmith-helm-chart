{{- if .Values.pdb.enabled }}
{{- if .Capabilities.APIVersions.Has "policy/v1" -}}
apiVersion: policy/v1
{{- else}}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "fhirsmith.fullname" . }}
  labels:
    {{- include "fhirsmith.labels" . | nindent 4 }}
spec:
  {{- /* Quote so a percentage like "33%" is always an explicit string
         (IntOrString also accepts a quoted integer such as "2"). */}}
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable | quote }}
  {{- else if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable | quote }}
  {{- end }}
  {{- /* unhealthyPodEvictionPolicy is only valid on Kubernetes >= 1.26. */}}
  {{- if semverCompare ">=1.26-0" .Capabilities.KubeVersion.Version }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  {{- end }}
  selector:
    matchLabels:
      {{- include "fhirsmith.selectorLabels" . | nindent 6 }}
{{- end }}
