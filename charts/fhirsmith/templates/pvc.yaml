{{- /* The StatefulSet provisions per-replica volumes via volumeClaimTemplates,
       so this standalone claim is only for the Deployment. */}}
{{- if and .Values.persistence.enabled (eq (include "fhirsmith.workloadKind" .) "Deployment") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fhirsmith.fullname" . }}-data
  labels:
    {{- include "fhirsmith.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | default "ReadWriteOnce" }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "10Gi" }}
{{- end }}
